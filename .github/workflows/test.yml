# GitHub Actions — test + typecheck + package across the 3 OSes.
# Lands as .github/workflows/test.yml in the public repo (round-3 ticket A6 adapts as needed).
name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Prove the app PACKAGES on every OS (no publish, no signing in CI).
      - run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
